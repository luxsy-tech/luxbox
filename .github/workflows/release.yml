# Baut Luxbox für Windows und Linux und legt bei jedem Version-Tag
# ein GitHub-Release mit den Installern + Update-Metadaten (latest*.yml) an.
#
# Ausloeser:
#   - Push eines Tags  v*        -> Bauen + Release anlegen
#   - manuell (workflow_dispatch) -> nur Bauen, Artefakte im Workflow-Lauf
#
# Ablauf: Matrix-Job (win/linux) baut mit --publish never und laedt die
# Artefakte hoch, ein folgender Release-Job erzeugt das Release einmal zentral
# (zwei parallele Jobs duerfen dasselbe Release nie gleichzeitig anlegen).

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_cmd: npm run dist:win:machine -- --publish never
            artifact: windows
          - os: ubuntu-latest
            build_cmd: npm run dist:linux -- --publish never
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # rpmbuild fuer das rpm-Ziel (deb/AppImage brauchen nichts dazu)
      - name: rpm-Werkzeuge installieren
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm

      - name: Abhaengigkeiten installieren
        run: npm ci

      # Das Release-Tag muss exakt v<version> aus package.json sein,
      # sonst waeren die Download-URLs in latest*.yml nicht erreichbar.
      - name: Tag gegen package.json pruefen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zur Version in package.json ($want)"
            exit 1
          fi
          echo "Tag und Version passen: $want"

      - name: Bauen
        run: ${{ matrix.build_cmd }}

      - name: Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/latest*.yml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Artefakte herunterladen
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release anlegen oder aktualisieren
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lh dist/
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release existiert bereits - Artefakte werden ersetzt."
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "Luxbox $GITHUB_REF_NAME" \
              --generate-notes
          fi
