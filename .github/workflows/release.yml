# Baut Luxbox fuer Windows, Linux und macOS und legt bei jedem Version-Tag
# ein GitHub-Release mit den Installern + Update-Metadaten (latest*.yml) an.
#
# Ausloeser:
#   - Push eines Tags  v*         -> Bauen + Release anlegen
#   - manuell (workflow_dispatch) -> nur Bauen, Artefakte im Workflow-Lauf
#
# Ablauf: Der Matrix-Job (win/linux) baut mit --publish never und laedt die
# Artefakte hoch, der Release-Job erzeugt das Release zentral. macOS laeuft
# ALS EIGENER JOB (siehe unten), wird aber ebenfalls vom Release mitgeholt.
#
# WARUM ubuntu-24.04 (nicht ubuntu-latest):
# Seit Okt. 2026 liefert ubuntu-latest ein 26.04-Image mit rpm 6.0.1. Diese
# Version ignoriert das "--define buildroot" von electron-builders gebuendeltem
# fpm 1.9.3 -> rpmbuild bricht mit "exit code 1" ab (alle Dateien "not found").
# 24.04 hat rpm 4.18 und baut rpm-Pakete einwandfrei.
#
# WARUM macos-15 (nicht macos-latest): gleiche Lektion wie ubuntu-latest -
# gepinnte Images ueberraschen nicht mit Toolchain-Wechseln. macos-15 ist
# arm64 und baut x64+arm64 per Cross-Build (ohne x64-Binaere auszufuehren).
#
# WARUM macOS ein EIGENER JOB ist (nicht Matrix-Teil):
# GitHub liefert macOS-arm64-Runner nur nach Kapazitaet. Beleg aus Lauf
# 45465204294: "The job was not acquired by Runner of type hosted even after
# multiple attempts" -> nach 15 Min. Warteschlange cancelled, OHNE dass ein
# Schritt lief. Waere das ein Tag-Lauf gewesen, haette die Matrix-Abhaengigkeit
# "needs: build" das GESAMTE Release gekillt, obwohl Windows+Linux gruen waren.
# Jetzt: build (win/linux) ist die einzige harte Voraussetzung fuer das
# Release, build_mac wird nur ABGEWARTET (needs) und sein Ergebnis IGNORIERT.
# Ein macOS-Ausfall kostet also hoechstens die .dmg, nie das Release.
#
# WARUM rpm in einem eigenen Schritt mit continue-on-error:
# Eine einzelne Paketform darf das gesamte Release nie blockieren - sonst
# fehlen Windows und AppImage, obwohl die einwandfrei gebaut waeren.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: ubuntu-24.04
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # rpmbuild fuer das rpm-Ziel (deb/AppImage brauchen nichts dazu)
      - name: rpm-Werkzeuge installieren
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm

      - name: Abhaengigkeiten installieren
        run: npm ci

      # Das Release-Tag muss exakt v<version> aus package.json sein,
      # sonst waeren die Download-URLs in latest*.yml nicht erreichbar.
      - name: Tag gegen package.json pruefen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zur Version in package.json ($want)"
            exit 1
          fi
          echo "Tag und Version passen: $want"

      # rpm ZUERST: electron-builder schreibt latest-linux.yml pro Lauf neu.
      # Der finale Lauf (AppImage) muss daher der letzte sein, damit die
      # Update-Metadaten den AppImage-Eintrag enthalten, den electron-updater
      # fuer Linux-Updates benutzt. Ein rpm-Fehler darf den Job nicht killen.
      - name: Bauen (rpm, optional)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: npx electron-builder --linux rpm --publish never

      - name: Bauen (AppImage und deb)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux AppImage deb --publish never

      - name: Bauen (Windows-Installer, maschinenweit)
        if: runner.os == 'Windows'
        run: npm run dist:win:machine -- --publish never

      - name: Artefakte hochladen
        uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/latest*.yml

  # Eigenstaendiger Job: siehe Kopfkommentar "WARUM macOS ein EIGENER JOB ist".
  # continue-on-error auf JOB-Ebene: ein Ausfall darf den Gesamtlauf nicht rot
  # machen, und der Release-Job prueft bewusst NICHT auf dieses Ergebnis.
  build_mac:
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Tag gegen package.json pruefen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zur Version in package.json ($want)"
            exit 1
          fi
          echo "Tag und Version passen: $want"

      # macOS: DMG fuer x64 + arm64, unsigned (kein Apple-Zertifikat).
      # CSC_IDENTITY_AUTO_DISCOVERY=false verhindert, dass electron-builder
      # erfolglos nach einem Signatur-Zertifikat sucht und deshalb fehlschlaegt.
      # Step-Ebene continue-on-error: der Upload darf trotzdem laufen.
      - name: Bauen (macOS DMG, unsigned)
        continue-on-error: true
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --publish never

      # warn statt error: ein Mac-Build ohne Ergebnis ist akzeptabel,
      # das Release bekommt dann schlicht keine .dmg.
      - name: Artefakte hochladen
        uses: actions/upload-artifact@v6
        with:
          name: dist-mac
          if-no-files-found: warn
          path: |
            dist/*.dmg
            dist/latest*.yml

  release:
    # WICHTIG: bewusst NICHT "success()" (Default) - das wuerde jeden Fehler
    # von build ODER build_mac zum Skipped fuehren. Stattdessen:
    #  - gewartet wird auf BEIDE Jobs (needs, inkl. macOS-Ausfall-Wartezeit)
    #  - freigegeben wird nur, wenn win/linux sicher success sind
    #  - build_mac wird ignoriert (Ergebnis egal, auch cancelled/failure)
    #  - !cancelled() verhindert, dass ein manuell abgebrochener Lauf
    #    trotzdem ein Release erzeugt
    if: |
      !cancelled() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.build.result == 'success'
    needs: [build, build_mac]
    runs-on: ubuntu-latest
    steps:
      - name: Artefakte herunterladen
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Release anlegen oder aktualisieren
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -lh dist/
          # GH_REPO setzt den Ziel-Repo explizit - der Job hat kein Git-Checkout,
          # an dem sich gh sonst orientieren wuerde.
          if gh release view "$GITHUB_REF_NAME" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release existiert bereits - Artefakte werden ersetzt."
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GH_REPO"
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GH_REPO" \
              --title "Luxbox $GITHUB_REF_NAME" \
              --generate-notes
          fi
