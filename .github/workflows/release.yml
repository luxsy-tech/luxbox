# Baut Luxbox fuer Windows, Linux und macOS und legt bei jedem Version-Tag
# ein GitHub-Release mit den Installern + Update-Metadaten (latest*.yml) an.
#
# Ausloeser:
#   - Push eines Tags  v*         -> Bauen + Release anlegen
#   - manuell (workflow_dispatch) -> nur Bauen, Artefakte im Workflow-Lauf
#
# Ablauf: Matrix-Job (win/linux/mac) baut mit --publish never und laedt die
# Artefakte hoch, ein folgender Release-Job erzeugt das Release einmal zentral
# (zwei parallele Jobs duerfen dasselbe Release nie gleichzeitig anlegen).
#
# WARUM ubuntu-24.04 (nicht ubuntu-latest):
# Seit Okt. 2026 liefert ubuntu-latest ein 26.04-Image mit rpm 6.0.1. Diese
# Version ignoriert das "--define buildroot" von electron-builders gebuendeltem
# fpm 1.9.3 -> rpmbuild bricht mit "exit code 1" ab (alle Dateien "not found").
# 24.04 hat rpm 4.18 und baut rpm-Pakete einwandfrei.
#
# WARUM macos-15 (nicht macos-latest): gleiche Lektion wie ubuntu-latest -
# gepinnte Images ueberraschen nicht mit Toolchain-Wechseln. macos-15 ist
# arm64, existiert stabil und reicht fuer x64+binaere Cross-Builds (electron
# baut x64 aus, ohne x64-Binaere auszufuehren).
#
# WARUM rpm UND macOS in eigenen Schritten mit continue-on-error:
# Eine einzelne Paketform darf das gesamte Release nie blockieren - sonst
# fehlen Windows und AppImage, obwohl die einwandfrei gebaut waeren. macOS
# laeuft zusaetzlich unsigned (kein Apple-Developer-Account) und ist damit
# der neuete und noch unerprobte Zweig der Pipeline.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: ubuntu-24.04
            artifact: linux
          - os: macos-15
            artifact: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # rpmbuild fuer das rpm-Ziel (deb/AppImage brauchen nichts dazu)
      - name: rpm-Werkzeuge installieren
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm

      - name: Abhaengigkeiten installieren
        run: npm ci

      # Das Release-Tag muss exakt v<version> aus package.json sein,
      # sonst waeren die Download-URLs in latest*.yml nicht erreichbar.
      - name: Tag gegen package.json pruefen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zur Version in package.json ($want)"
            exit 1
          fi
          echo "Tag und Version passen: $want"

      # rpm ZUERST: electron-builder schreibt latest-linux.yml pro Lauf neu.
      # Der finale Lauf (AppImage) muss daher der letzte sein, damit die
      # Update-Metadaten den AppImage-Eintrag enthalten, den electron-updater
      # fuer Linux-Updates benutzt. Ein rpm-Fehler darf den Job nicht killen.
      - name: Bauen (rpm, optional)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: npx electron-builder --linux rpm --publish never

      - name: Bauen (AppImage und deb)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux AppImage deb --publish never

      - name: Bauen (Windows-Installer, maschinenweit)
        if: runner.os == 'Windows'
        run: npm run dist:win:machine -- --publish never

      # macOS: DMG fuer x64 + arm64, unsigned (kein Apple-Zertifikat).
      # CSC_IDENTITY_AUTO_DISCOVERY=false verhindert, dass electron-builder
      # erfolglos nach einem Signatur-Zertifikat sucht und deshalb fehlschlaegt.
      - name: Bauen (macOS DMG, unsigned)
        if: runner.os == 'macOS'
        continue-on-error: true
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --publish never

      - name: Artefakte hochladen
        uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.artifact }}
          # macOS darf leer bleiben (continue-on-error beim Build), sonst
          # wuerde ein komplett gescheiterter Mac-Build das Release blockieren.
          if-no-files-found: ${{ matrix.artifact == 'mac' && 'warn' || 'error' }}
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.dmg
            dist/latest*.yml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Artefakte herunterladen
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Release anlegen oder aktualisieren
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -lh dist/
          # GH_REPO setzt den Ziel-Repo explizit - der Job hat kein Git-Checkout,
          # an dem sich gh sonst orientieren wuerde.
          if gh release view "$GITHUB_REF_NAME" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release existiert bereits - Artefakte werden ersetzt."
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GH_REPO"
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GH_REPO" \
              --title "Luxbox $GITHUB_REF_NAME" \
              --generate-notes
          fi
